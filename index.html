    function App() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('pkpm_kemenag_pedoman_2014_v2');
        return saved ? JSON.parse(saved) : INITIAL_DATA;
      });

      const [activeTab, setActiveTab] = useState('profil');
      const [toastMessage, setToastMessage] = useState('');

      // Auto save to Local Storage
      useEffect(() => {
        localStorage.setItem('pkpm_kemenag_pedoman_2014_v2', JSON.stringify(data));
      }, [data]);

      // Refresh Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const handleResetData = () => {
        if (window.confirm("Apakah Anda yakin ingin mengembalikan data ke pengaturan awal (default)? Semua data akan direset.")) {
          setData(INITIAL_DATA);
          showToast("Data berhasil direset ke standar Pedoman PKPM Kemenag.");
        }
      };

      const handleExportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `Backup_PKPM_${data.pengawas.nama.replace(/\s+/g, '_')}_${data.tahunPenilaian}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("Backup data JSON berhasil diunduh.");
      };

      const handleImportJSON = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const importedData = JSON.parse(event.target.result);
            setData(importedData);
            showToast("Data PKPM berhasil diimpor!");
          } catch (err) {
            showToast("Gagal mengimpor file: Format JSON tidak valid.");
          }
        };
        reader.readAsText(file);
      };

      const handlePrint = () => {
        window.print();
      };

      const handleExportPDF = () => {
        const element = document.getElementById('printable-document');
        showToast("Menyiapkan dokumen PDF PKPM...");
        const opt = {
          margin:       [8, 8, 8, 8],
          filename:     `Laporan_PKPM_Kemenag_${data.pengawas.nama.replace(/\s+/g, '_')}_${data.tahunPenilaian}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2, useCORS: true },
          jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
          showToast("PDF PKPM Berhasil diunduh!");
        }).catch(err => {
          console.error(err);
          showToast("Gagal mengekspor PDF.");
        });
      };

      // --- KALKULASI PENILAIAN PKPM BERDASARKAN JUKNIS PEDOMAN KEMENAG ---
      const activeIndicators = INDIKATOR_JENJANG[data.jenjangPengawas] || INDIKATOR_JENJANG.Madya;

      const calcKomponen = (listKey) => {
        const list = activeIndicators[listKey] || [];
        if (list.length === 0) return { avgSkor: 0, totalSkor: 0, count: 0 };
        let sum = 0;
        list.forEach(ind => {
          const val = Number(data.scores[ind.id]) || 1;
          sum += val;
        });
        const avgSkor = sum / list.length; // Skor Komponen (1.00 - 4.00)
        return { avgSkor, totalSkor: sum, count: list.length };
      };

      const k1Calc = calcKomponen('K1');
      const k2Calc = calcKomponen('K2');
      const k3Calc = calcKomponen('K3');
      const k4Calc = calcKomponen('K4');

      // Bobot Komponen Juknis Kemenag: K1=10, K2=50, K3=10, K4=30
      const nk1 = 10 * k1Calc.avgSkor;
      const nk2 = 50 * k2Calc.avgSkor;
      const nk3 = 10 * k3Calc.avgSkor;
      const nk4 = 30 * k4Calc.avgSkor;

      const totalNK = nk1 + nk2 + nk3 + nk4; // Max 400

      // 91-100: A (Amat Baik) | 76-90: B (Baik) | 61-75: C (Cukup) | 51-60: D (Sedang) | 0-50: E (Kurang)
      const getPredikatKemenag = (score) => {
        if (score >= 91) return { hur: 'A', ket: 'Amat Baik', color: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
        if (score >= 76) return { hur: 'B', ket: 'Baik', color: 'bg-blue-100 text-blue-800 border-blue-300' };
        if (score >= 61) return { hur: 'C', ket: 'Cukup', color: 'bg-yellow-100 text-yellow-800 border-yellow-300' };
        if (score >= 51) return { hur: 'D', ket: 'Sedang', color: 'bg-orange-100 text-orange-800 border-orange-300' };
        return { hur: 'E', ket: 'Kurang', color: 'bg-rose-100 text-rose-800 border-rose-300' };
      };

      const predikatKemenag = getPredikatKemenag(nilaiKinerjaAKhir);

      // --- MATRIKS PREDIKAT KINERJA BKN ---
      const calculatePredikatBKN = (hasil, perilaku) => {
        if (hasil === 'Diatas Ekspektasi' && perilaku === 'Diatas Ekspektasi') return 'Sangat Baik';
        if (hasil === 'Diatas Ekspektasi' && perilaku === 'Sesuai Ekspektasi') return 'Baik';
        if (hasil === 'Sesuai Ekspektasi' && perilaku === 'Diatas Ekspektasi') return 'Baik';
        if (hasil === 'Sesuai Ekspektasi' && perilaku === 'Sesuai Ekspektasi') return 'Baik';
        if (hasil === 'Dibawah Ekspektasi' && perilaku === 'Diatas Ekspektasi') return 'Butuh Perbaikan';
        if (hasil === 'Dibawah Ekspektasi' && perilaku === 'Sesuai Ekspektasi') return 'Kurang';
        if (hasil === 'Diatas Ekspektasi' && perilaku === 'Dibawah Ekspektasi') return 'Butuh Perbaikan';
        if (hasil === 'Sesuai Ekspektasi' && perilaku === 'Dibawah Ekspektasi') return 'Kurang';
        return 'Sangat Kurang';
      };

        data.penilaianAkhir.ratingHasilKerja,
        data.penilaianAkhir.ratingPerilakuKerja

          { name: 'Penyusunan Program (K1)', val: k1Calc.avgSkor, code: 'K1' },

          { name: 'Pembimbingan & Pelatihan Guru/KM (K4)', val: k4Calc.avgSkor, code: 'K4' }
        ];
        scoresArr.sort((a, b) => a.val - b.val);
        const lowest = scoresArr[0];

        if (lowest.val >= 3.8) {
          return "Secara umum seluruh komponen kinerja pengawas berada pada kualifikasi Amat Baik. Direkomendasikan untuk terus mempertahankan mutu pengawasan dan mengimbaskan praktik baik kepengawasan kepada sesama pengawas madrasah.";
        }
        if (lowest.code === 'K4') {
          return `Prioritas peningkatan kinerja berada pada Komponen ${lowest.name} (Skor: ${lowest.val.toFixed(2)}). Disarankan mengikuti workshop penyusunan program bimlat terstruktur di KKG/MGMP/KKKM dan pendampingan Penelitian Tindakan (PTK/PTS).`;
        }
        if (lowest.code === 'K2') {
          return `Prioritas peningkatan kinerja berada pada Komponen ${lowest.name} (Skor: ${lowest.val.toFixed(2)}). Disarankan memperintensif frekuensi kunjungan pendampingan SNP dan objektivitas penilaian PKKM/PKG di madrasah binaan.`;
        }
        if (lowest.code === 'K3') {
          return `Prioritas peningkatan kinerja berada pada Komponen ${lowest.name} (Skor: ${lowest.val.toFixed(2)}). Disarankan menyusun laporan evaluasi berbasis data Rapor Pendidikan untuk umpan balik konstruktif bagi madrasah.`;
        }

                          <td className="border border-black p-1.5 text-center" colSpan="2">TOTAL SKOR KINERJA (NILAI AKHIR = TOTAL SKOR / 400 x 100)</td>
                          <td className="border border-black p-1.5 text-center">100</td>
                          <td className="border border-black p-1.5 text-center">-</td>
                          <td className="border border-black p-1.5 text-center text-sm">{totalNK.toFixed(1)}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  {/* HASIL AKHIR & PREDIKAT */}
                  <div className="border border-black p-3 mb-5 bg-slate-50 text-[10px]">
                    <div className="grid grid-cols-2 gap-2 mb-2">
                      <div>NILAI KINERJA PKPM KEMENAG: <strong className="text-sm underline">{nilaiKinerjaAKhir.toFixed(2)}</strong></div>
                      <div>PREDIKAT PKPM (KEMENAG): <strong className="text-sm uppercase underline">{predikatKemenag.hur} ({predikatKemenag.ket})</strong></div>
                    </div>
                    <div className="border-t border-black pt-2 grid grid-cols-2 gap-2">
                      <div>RATING SKP / PERILAKU BKN: <strong>{data.penilaianAkhir.ratingHasilKerja} / {data.penilaianAkhir.ratingPerilakuKerja}</strong></div>
                      <div>PREDIKAT KINERJA PEGAWAI (BKN): <strong className="text-sm uppercase underline">{predikatBKN}</strong></div>
                    </div>
                  </div>

                  {/* REKOMENDASI PEMBINAAN */}
                  <div className="mb-6 border border-black p-3 text-[10px]">
                    <h4 className="font-bold underline mb-1">IV. REKOMENDASI HASIL PENILAIAN & PEMBINAAN PROPER</h4>
                    <p className="italic text-slate-800 mb-2">{getAnalisisRekomendasi()}</p>
                    {data.penilaianAkhir.catatanPenilai && (
                      <p className="border-t border-slate-300 pt-1">Catatan Penilai: "{data.penilaianAkhir.catatanPenilai}"</p>
                    )}
                  </div>

                  {/* LEMBAR TANDA TANGAN 3 PIHAK */}
                  <div className="grid grid-cols-2 gap-6 text-[10px] pt-2 page-break-inside-avoid">
                    <div className="text-center">
                      <p>Pegawai yang Dinilai,</p>
                      <div className="h-14"></div>
                      <p className="font-bold underline">{data.pengawas.nama}</p>
                      <p>NIP. {data.pengawas.nip}</p>
                    </div>
                    <div className="text-center">
                      <p>{data.penilaianAkhir.tempatPenilaian}, {data.penilaianAkhir.tanggalPenilaian}</p>
                      <p>Pejabat Penilai Kinerja,</p>
                      <div className="h-14"></div>
                      <p className="font-bold underline">{data.penilai.nama}</p>
                      <p>NIP. {data.penilai.nip}</p>
                    </div>
                    <div className="col-span-2 text-center pt-4 border-t border-slate-200">
                      <p>Mengetahui / Mengesahkan:</p>
                      <p className="font-bold">Atasan Pejabat Penilai Kinerja</p>
                      <div className="h-14"></div>
                      <p className="font-bold underline">{data.atasanPenilai.nama}</p>
                      <p>NIP. {data.atasanPenilai.nip}</p>
                    </div>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="bg-white border-t border-slate-200 py-3 mt-auto no-print">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-1">
              <p>© {new Date().getFullYear()} Aplikasi SIM-PKPM Kemenag - Memedomani Juknis Direktorat Pendidikan Madrasah Kemenag & e-Kinerja BKN</p>
              <p className="font-semibold text-emerald-800">Developed by : D.E.A 2026</p>
            </div>
          </footer>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
